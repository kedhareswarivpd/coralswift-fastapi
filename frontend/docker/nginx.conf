server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15M;

    # ---- Security headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # style-src must allow fonts.googleapis.com — index.html loads the brand
    # typefaces (Poppins/Inter/Montserrat/JetBrains Mono) as external
    # <link rel="stylesheet"> tags from there; without this, those @font-face
    # rules are CSP-blocked. font-src needs fonts.gstatic.com for the .woff2
    # files those stylesheets reference; the Material Symbols icon font is
    # self-hosted (public/fonts/, bundled into dist by Vite), so it is
    # covered by font-src 'self' and needs no CDN allowance — before it was
    # self-hosted, a blocked Google Fonts request left every icon rendering
    # as its literal fallback text ("folder", "receipt", ...).
    #
    # img-src includes http: (unlike frontend/vercel.json's production CSP,
    # which only allows https:) because this config only ever serves the
    # local Docker Compose stack, where MinIO is deliberately exposed to the
    # browser over plain http://localhost:<port> (see the S3_PUBLIC_URL_BASE
    # comment in docker-compose.override.yml) — uploaded media thumbnails in
    # the Admin Media Manager were CSP-blocked and broken without this,
    # found via a live Playwright walkthrough. Production storage (Supabase
    # Storage / S3) is always https, so this local allowance is a no-op there.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: http:; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; connect-src 'self' http://backend:8000 https://cdn.jsdelivr.net; media-src 'self'; frame-src https://www.google.com; object-src 'none'" always;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml video/mp4;

    # ---- API + uploaded assets: proxy straight through to the FastAPI backend ----
    # "backend" resolves via Docker Compose's internal DNS (the service name
    # defined in the root docker-compose.yml).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
    }

    # ---- Hero video ----
    location ~* \.mp4$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    # ---- Single-page app: let React Router handle unknown paths ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets Vite emits under /assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
